name: Build and Push Docker Image

# 生产已改用本地至服务器原生双机极速构建 (x-actions/deploy.sh)
# 此 Actions 构建仅保留作为手动兜底方案，避免日常提交浪费 Actions 资源
on:
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ github.repository }}
  ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
  ALIYUN_IMAGE: ${{ vars.ALIYUN_IMAGE }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Lowercase Image Name
        run: |
          echo "GHCR_IMAGE=${GHCR_IMAGE,,}" >> ${GITHUB_ENV}
        env:
          GHCR_IMAGE: '${{ env.GHCR_IMAGE }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_CR_USERNAME }}
          password: ${{ secrets.ALIYUN_CR_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: false

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set Lowercase Image Name & Short SHA
        run: |
          echo "GHCR_IMAGE=${GHCR_IMAGE,,}" >> ${GITHUB_ENV}
          echo "SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)" >> ${GITHUB_ENV}
        env:
          GHCR_IMAGE: '${{ env.GHCR_IMAGE }}'

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_CR_USERNAME }}
          password: ${{ secrets.ALIYUN_CR_PASSWORD }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          GHCR_SOURCES=""
          ALIYUN_SOURCES=""
          for f in *; do
            GHCR_SOURCES="${GHCR_SOURCES} ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}@sha256:${f}"
            ALIYUN_SOURCES="${ALIYUN_SOURCES} ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_IMAGE }}@sha256:${f}"
          done
          
          echo ">>> Merging and pushing to GHCR: ${GHCR_SOURCES}"
          docker buildx imagetools create -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest \
                                          -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:sha-${{ env.SHORT_SHA }} \
                                          ${GHCR_SOURCES}
          
          echo ">>> Merging and pushing to Aliyun ACR: ${ALIYUN_SOURCES}"
          docker buildx imagetools create -t ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_IMAGE }}:latest \
                                          -t ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_IMAGE }}:sha-${{ env.SHORT_SHA }} \
                                          ${ALIYUN_SOURCES}

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest
