<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Title Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#0f172a" font-size="22" font-weight="700" letter-spacing="0.5">X-ANALYTICS 全球科技与金融数据平台</text>
    <text x="0" y="24" fill="#64748b" font-size="13" font-weight="400">系统全局架构与三库联动示意图 (Redis-First 架构)</text>
  </g>

  <!-- Node 1: User Client -->
  <g transform="translate(60, 115)">
    <rect width="210" height="90" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
    <text x="105" y="42" fill="#0284c7" font-size="14" font-weight="700" text-anchor="middle">📱 用户端</text>
    <text x="105" y="64" fill="#475569" font-size="12" text-anchor="middle">Web 浏览器 / 移动端</text>
  </g>

  <!-- Node 2: Nginx Gateway -->
  <g transform="translate(410, 115)">
    <rect width="260" height="90" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5" />
    <text x="130" y="42" fill="#16a34a" font-size="14" font-weight="700" text-anchor="middle">🛡️ Nginx 网关 (x-actions)</text>
    <text x="130" y="64" fill="#475569" font-size="12" text-anchor="middle">反向代理与剥离 /analytics 前缀</text>
  </g>

  <!-- Connection: Client -> Nginx -->
  <line x1="270" y1="160" x2="400" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="335" y="150" fill="#0284c7" font-size="11" font-weight="600" text-anchor="middle">HTTPS 访问</text>

  <!-- Subgraph Container: x-analytics Core -->
  <g transform="translate(60, 255)">
    <rect width="730" height="380" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="20" y="30" fill="#0f172a" font-size="14" font-weight="700">⚡ 核心应用 (x-analytics)</text>

    <!-- Node 3a: Web Dashboard -->
    <g transform="translate(30, 55)">
      <rect width="180" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="90" y="38" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">🖥️ Web 仪表盘</text>
      <text x="90" y="58" fill="#64748b" font-size="11" text-anchor="middle">原生 JS / CSS / ECharts</text>
    </g>

    <!-- Node 3b: FastAPI Backend -->
    <g transform="translate(250, 55)">
      <rect width="210" height="80" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <text x="105" y="38" fill="#0284c7" font-size="14" font-weight="700" text-anchor="middle">⚡ FastAPI 后端</text>
      <text x="105" y="58" fill="#64748b" font-size="11" text-anchor="middle">RESTful API 服务</text>
    </g>

    <!-- Node 3c: Task Scheduler -->
    <g transform="translate(500, 55)">
      <rect width="200" height="80" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5" />
      <text x="100" y="38" fill="#9333ea" font-size="13" font-weight="700" text-anchor="middle">⏰ Task Scheduler</text>
      <text x="100" y="58" fill="#64748b" font-size="11" text-anchor="middle">后台定时任务与预热</text>
    </g>

    <!-- Node 3d: Redis Cache -->
    <g transform="translate(110, 245)">
      <rect width="220" height="95" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
      <text x="110" y="42" fill="#dc2626" font-size="14" font-weight="700" text-anchor="middle">🔴 Redis 缓存</text>
      <text x="110" y="65" fill="#475569" font-size="11" text-anchor="middle">唯一热数据源 (&lt;500ms)</text>
    </g>

    <!-- Node 3e: Postgres DB -->
    <g transform="translate(420, 245)">
      <rect width="220" height="95" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <text x="110" y="42" fill="#0284c7" font-size="14" font-weight="700" text-anchor="middle">🐘 Postgres 数据库</text>
      <text x="110" y="65" fill="#475569" font-size="11" text-anchor="middle">历史数据持久化存储</text>
    </g>

    <!-- Connections inside x-analytics -->
    <!-- Web UI -> Backend -->
    <line x1="210" y1="95" x2="240" y2="95" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)" />
    
    <!-- Backend -> Redis (读热数据) -->
    <path d="M 290 135 L 290 160 L 200 160 L 200 235" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" />
    <text x="245" y="155" fill="#dc2626" font-size="10" font-weight="600" text-anchor="middle">读热数据</text>

    <!-- Backend -> Postgres (读历史记录) -->
    <path d="M 410 135 L 410 160 L 470 160 L 470 235" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)" />
    <text x="440" y="155" fill="#0284c7" font-size="10" font-weight="600" text-anchor="middle">读历史记录</text>

    <!-- Scheduler -> Redis (定时缓存预热) -->
    <path d="M 530 135 L 530 205 L 290 205 L 290 235" fill="none" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)" />
    <text x="410" y="200" fill="#9333ea" font-size="10" font-weight="600" text-anchor="middle">定时缓存预热</text>

    <!-- Scheduler -> Postgres (归档历史) -->
    <path d="M 600 135 L 600 235" fill="none" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)" />
    <text x="605" y="180" fill="#9333ea" font-size="10" font-weight="600">归档历史</text>
  </g>

  <!-- Connection: Nginx -> FastAPI Backend -->
  <path d="M 540 205 L 540 235 L 355 235 L 355 300" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="450" y="228" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">反向代理 :8080</text>

  <!-- Node 4: Cloudflare Worker -->
  <g transform="translate(850, 255)">
    <rect width="290" height="110" rx="8" fill="#f8fafc" stroke="#ea580c" stroke-width="1.5" />
    <text x="145" y="42" fill="#ea580c" font-size="14" font-weight="700" text-anchor="middle">⚡ Cloudflare Worker (x-worker)</text>
    <text x="145" y="66" fill="#475569" font-size="12" text-anchor="middle">通用 HTTP 代理中继</text>
    <text x="145" y="86" fill="#ea580c" font-size="11" font-weight="600" text-anchor="middle">防护源站 IP 免遭封锁</text>
  </g>

  <!-- Node 5: External APIs -->
  <g transform="translate(850, 480)">
    <rect width="290" height="110" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="145" y="42" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">🌐 外部金融数据 API</text>
    <text x="145" y="66" fill="#475569" font-size="12" text-anchor="middle">AkShare / 新浪财经 / 东方财富</text>
    <text x="145" y="86" fill="#64748b" font-size="11" text-anchor="middle">行情、资金流向、QDII 持仓</text>
  </g>

  <!-- Connection: Task Scheduler -> Worker -->
  <path d="M 760 350 L 840 310" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" />
  <text x="800" y="320" fill="#ea580c" font-size="11" font-weight="600" text-anchor="middle">代理抓取</text>

  <!-- Connection: Worker -> External APIs -->
  <line x1="995" y1="365" x2="995" y2="470" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" />
  <text x="1005" y="422" fill="#ea580c" font-size="11" font-weight="600">安全发包</text>

</svg>
